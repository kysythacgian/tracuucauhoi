<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu câu hỏi NQTW4 khóa XIV</title>
<style>
    :root {
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --primary-soft: #eff6ff;
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --border: #e2e8f0;
        --ok-bg: #dcfce7;
        --ok-text: #166534;
        --ok-border: #22c55e;
        --bad-bg: #fee2e2;
        --bad-text: #991b1b;
        --bad-border: #ef4444;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
        padding: 24px 16px 48px;
    }

    .container {
        max-width: 760px;
        margin: 0 auto;
    }

    /* ---------- Đầu trang (canh giữa) ---------- */
    header {
        text-align: center;
        margin-bottom: 20px;
    }

    h1 {
        font-size: 24px;
        line-height: 1.3;
        color: var(--primary);
        margin-bottom: 18px;
    }

    /* ---------- Hai cửa sổ (tab) ---------- */
    .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        background: #e2e8f0;
        border-radius: 12px;
        max-width: 460px;
        margin: 0 auto 18px;
    }

    .tab {
        padding: 11px 8px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background .15s, color .15s;
    }

    .tab:hover { color: var(--text); }

    .tab.active {
        background: var(--card);
        color: var(--primary);
        box-shadow: 0 1px 3px rgba(15, 23, 42, .12);
    }

    .tab:focus-visible, .filter-btn:focus-visible, .btn:focus-visible,
    summary:focus-visible, .option:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    /* ---------- Tìm kiếm + lọc ---------- */
    .search-wrap {
        position: relative;
        width: 100%;
        max-width: 460px;
        margin: 0 auto 14px;
    }

    .search-box {
        display: block;
        width: 100%;
        padding: 12px 44px;
        font-size: 16px;
        text-align: center;
        border: 2px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        outline: none;
        transition: border-color .2s;
    }

    .search-box:focus { border-color: var(--primary); }

    .search-clear {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 50%;
        background: #e2e8f0;
        color: #475569;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .search-clear:hover { background: #cbd5e1; }
    .search-clear:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .filters {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 18px;
    }

    .filter-btn {
        padding: 7px 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        cursor: pointer;
        font-size: 14px;
        color: var(--text);
        transition: background .15s, color .15s, border-color .15s;
    }

    .filter-btn:hover { background: #f8fafc; }

    .filter-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
    }

    /* ---------- Thanh trạng thái / điều khiển (canh giữa) ---------- */
    .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px 14px;
        margin-bottom: 14px;
        min-height: 36px;
        font-size: 14px;
        color: var(--muted);
        text-align: center;
    }

    .bar b { color: var(--text); }
    .bar .ok { color: var(--ok-text); }
    .bar .bad { color: var(--bad-text); }

    .btn {
        padding: 7px 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        color: var(--primary);
    }

    .btn:hover { background: var(--primary-soft); }

    /* ---------- Câu hỏi (accordion) ---------- */
    details, .qcard {
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 4px solid var(--border);
        border-radius: 10px;
        margin-bottom: 12px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
    }

    .qcard-head {
        display: grid;
        grid-template-columns: 1fr;
        align-items: start;
        gap: 12px;
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 600;
    }

    details.right { border-left-color: var(--ok-border); }
    details.wrong { border-left-color: var(--bad-border); }

    summary {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: start;
        gap: 12px;
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        list-style: none;
        user-select: none;
    }

    summary::-webkit-details-marker { display: none; }

    summary.no-tag { grid-template-columns: 1fr auto; }

    summary::after {
        content: "";
        width: 8px;
        height: 8px;
        margin-top: 8px;
        border-right: 2px solid var(--primary);
        border-bottom: 2px solid var(--primary);
        transform: rotate(45deg);
        transition: transform .2s;
    }

    details[open] > summary::after {
        transform: rotate(-135deg);
        margin-top: 12px;
    }

    .topic-tag {
        font-size: 11px;
        font-weight: 600;
        background: #e0e7ff;
        color: #3730a3;
        padding: 3px 8px;
        border-radius: 6px;
        white-space: nowrap;
        margin-top: 2px;
    }

    .options {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0 16px 16px;
    }

    .option {
        position: relative;
        padding: 10px 40px 10px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f8fafc;
        font-size: 14.5px;
        color: #334155;
        text-align: left;
        transition: background .15s, border-color .15s;
    }

    .quiz .option { cursor: pointer; }
    .quiz .option:hover { background: var(--primary-soft); border-color: #93c5fd; }
    .quiz .option.locked { cursor: default; }
    .quiz .option.locked:hover { background: #f8fafc; border-color: var(--border); }

    .option.correct {
        background: var(--ok-bg) !important;
        border-color: var(--ok-border) !important;
        color: var(--ok-text);
        font-weight: 600;
    }

    .option.incorrect {
        background: var(--bad-bg) !important;
        border-color: var(--bad-border) !important;
        color: var(--bad-text);
        font-weight: 600;
    }

    .option.correct::after,
    .option.incorrect::after {
        position: absolute;
        right: 14px;
        top: 10px;
        font-weight: 700;
    }

    .option.correct::after { content: "✓"; }
    .option.incorrect::after { content: "✗"; }

    .empty {
        text-align: center;
        color: var(--muted);
        padding: 32px 0;
    }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
        body { padding: 16px 12px 40px; }
        h1 { font-size: 21px; }
        summary {
            grid-template-columns: 1fr auto;
            gap: 6px 10px;
            padding: 14px;
        }
        .qcard-head { grid-template-columns: 1fr; gap: 6px; padding: 14px; }
        .topic-tag { grid-column: 1 / -1; justify-self: start; margin-top: 0; }
        .options { padding: 0 14px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
    }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>Học tập và trả lời câu hỏi <br> Nghị quyết TW4 khóa XIV</h1>

        <div class="tabs" role="tablist" aria-label="Chế độ">
            <button class="tab active" role="tab" aria-selected="true" data-mode="quiz">Trả lời câu hỏi</button>
            <button class="tab" role="tab" aria-selected="false" data-mode="answers">Mở tất cả đáp án</button>
        </div>

        <div class="search-wrap">
            <input type="text" id="searchInput" class="search-box" placeholder="Gõ từ khóa để tìm câu hỏi..." aria-label="Tìm kiếm câu hỏi">
            <button type="button" id="searchClear" class="search-clear hidden" aria-label="Xoá nội dung tìm kiếm" title="Xoá">&times;</button>
        </div>
    </header>

    <div class="filters" id="filters">
        <button class="filter-btn active" data-topic="All">Tất cả</button>
        <button class="filter-btn" data-topic="NQ 31">NQ 31</button>
        <button class="filter-btn" data-topic="NQ 29">NQ 29</button>
        <button class="filter-btn" data-topic="NQ 30">NQ 30</button>
        <button class="filter-btn" data-topic="QĐ 224">QĐ 224</button>
        <button class="filter-btn" data-topic="KL 105">KL 105</button>
        <button class="filter-btn" data-topic="KL 106">KL 106</button>
    </div>

    <div class="bar" id="bar"></div>

    <div id="questionsList"></div>
</div>

<script>
    // Toàn bộ dữ liệu câu hỏi và đáp án
    const quizData = [
        // CHUYÊN ĐỀ 1: NQ 31
        { topic: "NQ 31", q: "Câu 1. Đặt trong yêu cầu phát triển đất nước ở kỷ nguyên mới, nhận thức nào phản ánh đầy đủ nhất vị trí và yêu cầu đối với công tác xây dựng, chỉnh đốn Đảng?", options: ["A. Đây là nhiệm vụ then chốt, thường xuyên, quyết định thành công của sự nghiệp xây dựng và bảo vệ Tổ quốc trong kỷ nguyên mới.", "B. Đây là nhiệm vụ trọng tâm trong giai đoạn kiện toàn tổ chức bộ máy; kết quả chủ yếu thể hiện ở sự hoàn chỉnh về tổ chức, quy chế và đội ngũ.", "C. Đây là nhiệm vụ tập trung vào phát hiện, xử lý vi phạm và tăng cường kỷ luật, qua đó củng cố sức chiến đấu và giữ vững sự ổn định của tổ chức đảng."], ans: "A" },
        { topic: "NQ 31", q: "Câu 2. Quan hệ giữa “kiên định” và “đổi mới” được thể hiện như thế nào trong tư duy chỉ đạo của Nghị quyết?", options: ["A. Kiên định mục tiêu và nguyên tắc là nền tảng; đổi mới chỉ cần đặt ra ở cách tổ chức thực hiện, không nhất thiết phát triển nhận thức và lý luận.", "B. Đổi mới phải đi trước để đáp ứng thực tiễn; khi yêu cầu phát triển thay đổi có thể chủ động điều chỉnh các nguyên tắc nền tảng.", "C. Kiên định và vận dụng, phát triển sáng tạo chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh, lý luận về đường lối đổi mới, mục tiêu độc lập dân tộc và chủ nghĩa xã hội, các nguyên tắc tổ chức, hoạt động của Đảng. Trên nền tảng đó, không ngừng đổi mới tư duy, phát triển lý luận, tổng kết thực tiễn, nâng cao năng lực dự báo và kiến tạo tầm nhìn dài hạn."], ans: "C" },
        { topic: "NQ 31", q: "Câu 3. Điểm cốt lõi nào thể hiện hiệu quả xử lý vi phạm, không để vi phạm tương tự tái diễn?", options: ["A. Tiếp tục tăng mức xử lý kỷ luật đối với các trường hợp trực tiếp vi phạm, coi tính nghiêm minh của xử lý là kết quả khắc phục chủ yếu.", "B. Chuyển mạnh từ phát hiện, xử lý khi vi phạm sang chủ động nhận diện, cảnh báo, phòng ngừa từ sớm, từ xa, từ gốc; kết hợp xử lý nghiêm vi phạm với loại bỏ nguyên nhân, điều kiện phát sinh và ngăn ngừa tái diễn.", "C. Tập trung giáo dục, nhắc nhở và hoàn thiện hồ sơ kiểm điểm; chuyển việc theo dõi các nguy cơ tái diễn sang các kỳ kiểm tra tiếp theo."], ans: "B" },
        { topic: "NQ 31", q: "Câu 4. Đâu là điểm nâng tầm cốt lõi của yêu cầu “tự đổi mới, tự chỉnh đốn, tự hoàn thiện” đối với một đảng cầm quyền?", options: ["A. Tăng tần suất kiểm điểm, đánh giá và sơ kết để các cấp ủy sớm nhận diện và khắc phục khuyết điểm.", "B. Tăng cường sự giám sát từ cơ quan cấp trên và các chủ thể bên ngoài để kịp thời phát hiện sai phạm.", "C. Tạo chuyển biến sâu sắc về nhận thức và hành động trong toàn Đảng và hệ thống chính trị về xây dựng, chỉnh đốn Đảng là quy luật phát triển, nhu cầu tự thân, thường xuyên của Đảng."], ans: "C" },
        { topic: "NQ 31", q: "Câu 5. Thước đo nào cho thấy rõ nhất công tác xây dựng, chỉnh đốn Đảng thực sự góp phần nâng cao năng lực lãnh đạo, cầm quyền?", options: ["A. Số lượng nghị quyết, chủ trương, chương trình, kế hoạch được ban hành và mức độ hoàn thành quy trình triển khai.", "B. Chất lượng chủ trương, quyết sách, năng lực và hiệu quả tổ chức thực hiện, kết quả phát triển của đất nước.", "C. Kết quả tăng trưởng và các chỉ tiêu kinh tế - xã hội, không cần gắn riêng với chất lượng quyết sách, trách nhiệm và tiến độ tổ chức thực hiện."], ans: "B" },
        { topic: "NQ 31", q: "Câu 6. Phương án nào thể hiện đúng nhất bước phát triển trong việc xây dựng Đảng “thật sự là đạo đức, là văn minh” theo Nghị quyết?", options: ["A. Chuyển các giá trị vì nước, vì dân, cần, kiệm, liêm chính, chí công vô tư, trung thực, nêu gương từ yêu cầu tu dưỡng, rèn luyện thành chuẩn mực bắt buộc trong ứng xử, ra quyết định, sử dụng quyền lực và kỷ luật thực thi công vụ.", "B. Đặt trọng tâm vào giáo dục, tự giác tu dưỡng và các phong trào nêu gương; các chuẩn mực về hành vi, quyết định và sử dụng quyền lực sẽ hình thành từ quá trình rèn luyện.", "C. Xây dựng hệ thống văn hóa lãnh đạo, văn hóa cầm quyền, văn hóa quản lý và văn hóa liêm chính như bốn thành tố độc lập ngang nhau; đánh giá chủ yếu qua việc tuân thủ quy tắc ứng xử."], ans: "A" },
        { topic: "NQ 31", q: "Câu 7. Theo Nghị quyết, khi phân cấp nhiệm vụ cho cấp sát việc, sát dân, phương án nào bảo đảm đồng bộ nhất giữa trao quyền và trách nhiệm?", options: ["A. Giao rõ nhiệm vụ, tăng nguồn lực nhưng vẫn yêu cầu cấp dưới xin ý kiến cấp trên trước các quyết định thuộc thẩm quyền để giảm rủi ro.", "B. Trao quyền quyết định và yêu cầu cấp dưới tự chịu trách nhiệm; hoạt động kiểm tra, giám sát chủ yếu tiến hành sau khi phát sinh khó khăn, sai phạm.", "C. Trao đủ thẩm quyền, nguồn lực và trách nhiệm giải trình; cấp trên tập trung định hướng, tiêu chuẩn, kiểm tra, giám sát, cấp dưới chủ động quyết định và chịu trách nhiệm theo thẩm quyền. Kiểm soát quyền lực xuyên suốt từ giao quyền, thực hiện quyền đến kiểm tra, giám sát."], ans: "C" },
        { topic: "NQ 31", q: "Câu 8. Theo quan điểm “Dân là gốc”, đâu là cách hiểu đầy đủ nhất về cơ sở tạo dựng và kiểm chứng uy tín của Đảng?", options: ["A. Đề cao sự đồng thuận của Nhân dân trong quá trình góp ý chủ trương, quyết sách; kết quả được đánh giá chủ yếu qua mức độ tham gia và ủng hộ.", "B. Xây dựng Đảng phải vì Nhân dân, dựa vào Nhân dân và chịu sự giám sát của Nhân dân. Lấy chất lượng cuộc sống, sự đồng thuận và niềm tin của Nhân dân làm thước đo.", "C. Lấy sự hài lòng của Nhân dân làm thước đo; việc góp ý, giám sát và giải quyết kiến nghị trước hết do các cơ quan chuyên trách đảm nhận."], ans: "B" },
        { topic: "NQ 31", q: "Câu 9. Việc khuyến khích, bảo vệ cán bộ dám nghĩ, dám làm, dám chịu trách nhiệm vì lợi ích chung phải tuân theo nguyên tắc nào?", options: ["A. Phân biệt sai phạm do vụ lợi, cố ý làm trái với rủi ro phát sinh trong đổi mới sáng tạo; việc bảo vệ phải căn cứ động cơ trong sáng, vì lợi ích chung, đúng thẩm quyền và có kiểm soát, không bao che hoặc miễn trừ trách nhiệm.", "B. Ưu tiên bảo vệ người có sáng kiến và có động cơ tích cực; chỉ xem xét trách nhiệm khi chứng minh được mục đích vụ lợi.", "C. Chỉ bảo vệ các quyết định sáng tạo đã đạt kết quả dự kiến; trường hợp chưa đạt kết quả phải xử lý trách nhiệm như các vi phạm thông thường."], ans: "A" },
        { topic: "NQ 31", q: "Câu 10. Vai trò của công nghệ số, dữ liệu và trí tuệ nhân tạo trong xây dựng Đảng văn minh thể hiện như thế nào?", options: ["A. Chuẩn hóa các chỉ số và tự động hóa việc chấm điểm để hạn chế tối đa phán đoán, trách nhiệm của các chủ thể có thẩm quyền.", "B. Ưu tiên hoàn thiện hồ sơ, dữ liệu điện tử và báo cáo định lượng; sử dụng kết quả trên nền tảng số làm căn cứ quyết định cuối cùng.", "C. Là thành tố quan trọng trong “tổ chức bộ máy khoa học, tinh gọn, vận hành thông suốt”."], ans: "C" },
        { topic: "NQ 31", q: "Câu 11. Khi nhìn lại các nghị quyết Trung ương 4 khóa XI, khóa XII, Kết luận Trung ương 4 khóa XIII và định hướng của nghị quyết Trung ương 4 khóa XIV, cách khái quát nào phản ánh đúng nhất mạch kế thừa và phát triển?", options: ["A. Tiếp tục coi kiểm điểm, xem xét, xử lý vi phạm là nội dung bao trùm; nâng hiệu quả xây dựng Đảng chủ yếu bằng tăng cường kỷ luật và chế tài.", "B. Yêu cầu xây dựng, chỉnh đốn nghiêm minh, kết hợp ngày càng chặt chẽ “xây” và “chống”; giữa giáo dục, rèn luyện với giữ nghiêm kỷ luật, kỷ cương và kiểm soát quyền lực; chuyển mạnh từ xử lý vi phạm sang chủ động phòng ngừa, cảnh báo từ sớm, từ xa.", "C. Chuyển trọng tâm từ xây dựng tổ chức đảng, đảng viên sang đổi mới quản lý nhà nước, coi cải cách hành chính là nội dung thay thế cơ bản cho xây dựng Đảng."], ans: "B" },
        { topic: "NQ 31", q: "Câu 12. Từ yêu cầu “cán bộ là nhân tố quyết định”, “công tác cán bộ là then chốt của then chốt”, trách nhiệm của người đứng đầu cần được hiểu thế nào?", options: ["A. Chịu trách nhiệm cả về kết quả công tác và chất lượng tổ chức, đội ngũ, đoàn kết nội bộ và khả năng phát huy trí tuệ tập thể.", "B. Tập trung chịu trách nhiệm về việc phân công, kiểm tra và hoàn thành nhiệm vụ; chất lượng đội ngũ và nguồn kế cận do cấp có thẩm quyền về công tác cán bộ quyết định.", "C. Chịu trách nhiệm về chi tiêu của cơ quan, đơn vị; những quyết định đã được tập thể thông qua thì chỉ xem xét trách nhiệm chung của tập thể."], ans: "A" },
        { topic: "NQ 31", q: "Câu 13. Một chi bộ sinh hoạt đủ kỳ, có đông đảng viên phát biểu nhưng ít vấn đề được giải quyết và khuyết điểm thường lặp lại. Theo Nghị quyết, tiêu chí nào cần được coi trọng để tạo chuyển biến thực chất?", options: ["A. Bảo đảm đủ nội dung, thời lượng, tỉ lệ tham gia và chất lượng biên bản sinh hoạt, coi đó là điều kiện tiên quyết đánh giá chi bộ.", "B. Tăng thời gian trao đổi, giáo dục chính trị, tư tưởng để nâng cao đồng thuận; các vấn đề khó tiếp tục nghiên cứu, chưa cần xác định trách nhiệm ngay.", "C. Sinh hoạt phải thiết thực, dân chủ, có trọng tâm, bám sát nhiệm vụ chính trị; mọi vấn đề phải được thảo luận và đi đến kết luận, phân công, thời hạn và kiểm tra kết quả."], ans: "C" },
        { topic: "NQ 31", q: "Câu 14. Điểm mới cần nhận thức đầy đủ về chế độ trách nhiệm thực chất là gì?", options: ["A. Tăng số đợt kiểm tra của cấp trên, tập trung vào các hành vi lạm quyền, vụ lợi và sử dụng sai nguồn lực đã được phát hiện.", "B. Phân định rõ trách nhiệm của tập thể, cá nhân, người đứng đầu, cơ quan tham mưu, người đề xuất, người quyết định, người tổ chức thực hiện và người kiểm tra, giám sát, theo nguyên tắc quyền hạn đến đâu, trách nhiệm đến đó.", "C. Để hạn chế rủi ro, cấp trên giữ quyền quyết định cuối cùng đối với phần lớn vấn đề mới, khó; cấp dưới tập trung tổ chức thực hiện."], ans: "B" },
        { topic: "NQ 31", q: "Câu 15. Một chủ trương được đánh giá là đúng nhưng triển khai chậm, không tạo chuyển biến rõ. Theo tinh thần đổi mới của Nghị quyết, khâu nào phải được thay đổi căn bản?", options: ["A. Quản trị xuyên suốt từ xác định vấn đề, chuẩn bị quyết sách, thể chế hóa đến giao người, thẩm quyền, nguồn lực, tổ chức thực hiện, kiểm tra, phản hồi, điều chỉnh; đo kết quả và quy trách nhiệm đến cùng.", "B. Tăng cường quán triệt, tuyên truyền và ban hành văn bản hướng dẫn kịp thời, đồng thời giao cấp dưới chủ động lựa chọn biện pháp thực hiện.", "C. Tổ chức thêm các đợt kiểm tra cuối kỳ, tổng hợp kết quả và rút kinh nghiệm để hoàn thiện việc ban hành nghị quyết ở nhiệm kỳ sau."], ans: "A" },

        // CHUYÊN ĐỀ 2: NQ 29
        { topic: "NQ 29", q: "Câu 1. Theo Nghị quyết, Đảng thực hiện phương thức lãnh đạo chủ yếu bằng những phương thức nào?", options: ["A. Bằng hoạt động quản lý hành chính, điều hành trực tiếp và quyết định thay các cơ quan nhà nước.", "B. Bằng Cương lĩnh, đường lối, chủ trương, định hướng chiến lược; công tác tư tưởng, tuyên truyền, vận động; công tác tổ chức, cán bộ; kiểm tra, giám sát, kiểm soát quyền lực; vai trò tiên phong, gương mẫu của cán bộ, đảng viên.", "C. Chủ yếu bằng việc phân bổ nguồn lực, ban hành pháp luật và trực tiếp tổ chức thực hiện mọi nhiệm vụ phát triển kinh tế - xã hội."], ans: "B" },
        { topic: "NQ 29", q: "Câu 2. Quan điểm của Nghị quyết về mối quan hệ giữa quyền lãnh đạo và trách nhiệm chính trị được xác định như thế nào?", options: ["A. Quyền lãnh đạo thuộc về tập thể; cá nhân chỉ chịu trách nhiệm chính trị khi có vi phạm pháp luật.", "B. Cấp trên chịu trách nhiệm thay cho cấp dưới đối với mọi nhiệm vụ đã phân cấp, phân quyền.", "C. Quyền lãnh đạo gắn với trách nhiệm chính trị; thẩm quyền đến đâu, trách nhiệm đến đó."], ans: "C" },
        { topic: "NQ 29", q: "Câu 3. Nội dung nào sau đây được Nghị quyết xác định là thước đo hiệu quả lãnh đạo, cầm quyền?", options: ["A. Chất lượng quyết sách, kết quả thực hiện, sự phát triển của đất nước và sự hài lòng của Nhân dân.", "B. Số lượng văn bản, nghị quyết được ban hành và số cuộc họp được tổ chức trong từng năm.", "C. Mức độ phân cấp, phân quyền và số lượng nhiệm vụ được giao cho cấp dưới."], ans: "A" },
        { topic: "NQ 29", q: "Câu 4. Mục tiêu tổng quát về đổi mới phương thức lãnh đạo, cầm quyền của Đảng được Nghị quyết xác định theo hướng nào?", options: ["A. Tập trung thống nhất mọi hoạt động quản lý, điều hành vào cấp ủy để bảo đảm sự lãnh đạo toàn diện.", "B. Khoa học, dân chủ, pháp quyền, hiện đại, vì lợi ích quốc gia - dân tộc và vì Nhân dân.", "C. Ưu tiên hoàn thiện tổ chức bộ máy trước, việc đổi mới phương thức lãnh đạo được thực hiện sau khi bộ máy ổn định."], ans: "B" },
        { topic: "NQ 29", q: "Câu 5. Đến năm 2045, Nghị quyết đặt ra yêu cầu chủ yếu nào đối với phương thức lãnh đạo, cầm quyền của Đảng?", options: ["A. Hoàn thành việc phân cấp toàn bộ thẩm quyền của Trung ương cho địa phương và cơ sở.", "B. Tập trung chuẩn hóa quy trình nội bộ, lấy số lượng văn bản ban hành làm tiêu chí đánh giá chủ yếu.", "C. Thực sự khoa học, dân chủ, pháp quyền, hiện đại, thích ứng cao, phù hợp với yêu cầu quản trị quốc gia hiện đại, gắn với mục tiêu trở thành nước phát triển, thu nhập cao theo định hướng xã hội chủ nghĩa."], ans: "C" },
        { topic: "NQ 29", q: "Câu 6. Việc vận hành thực chất cơ chế “Đảng lãnh đạo, Nhà nước quản lý, Nhân dân làm chủ” đòi hỏi điều gì?", options: ["A. Đảng xác định đường lối, định hướng chiến lược, quyết định vấn đề lớn theo thẩm quyền; Nhà nước kịp thời thể chế hóa, quản lý, điều hành, kiến tạo phát triển; Nhân dân thực hiện quyền làm chủ, tham gia xây dựng Đảng, xây dựng Nhà nước, giám sát hoạt động của hệ thống chính trị và thụ hưởng thành quả phát triển.", "B. Đảng trực tiếp thực hiện các công việc quản lý, điều hành; Nhà nước chủ yếu làm nhiệm vụ tham mưu và báo cáo.", "C. Mặt trận Tổ quốc Việt Nam thay cơ quan nhà nước tổ chức thực hiện chính sách và giải quyết công việc hành chính cho Nhân dân."], ans: "A" },
        { topic: "NQ 29", q: "Câu 7. Theo Nghị quyết, mỗi quyết sách phải xác định rõ những nội dung chủ yếu nào?", options: ["A. Chủ yếu xác định cơ quan chủ trì và thời điểm báo cáo; các nội dung còn lại được bổ sung trong quá trình thực hiện.", "B. Mục tiêu cuối cùng, chủ thể thực hiện, trách nhiệm, nguồn lực, thời hạn, sản phẩm.", "C. Chỉ cần xác định mục tiêu và tiến độ; chủ thể thực hiện được lựa chọn sau khi quyết sách được ban hành."], ans: "B" },
        { topic: "NQ 29", q: "Câu 8. Nguyên tắc phân cấp, phân quyền được Nghị quyết xác định như thế nào?", options: ["A. Phân cấp càng nhiều càng tốt, không cần gắn với điều kiện nguồn lực và cơ chế kiểm soát.", "B. Cấp dưới thực hiện nhiệm vụ nhưng phải xin ý kiến cấp trên trước khi quyết định mọi vấn đề đã được phân cấp.", "C. Phân cấp, phân quyền phải bảo đảm rõ ràng, thực chất, gắn với trách nhiệm, nguồn lực, hậu kiểm và kiểm soát quyền lực."], ans: "C" },
        { topic: "NQ 29", q: "Câu 9. Nghị quyết yêu cầu kiểm soát quyền lực được giao bằng những phương thức nào?", options: ["A. Bằng thể chế, quy chế, quy trình, dữ liệu, công khai, minh bạch và trách nhiệm giải trình; kiểm soát cả hành vi lạm quyền, vượt quyền và tình trạng né, không tránh thực hiện đầy đủ thẩm quyền, trách nhiệm.", "B. Chủ yếu bằng kiểm tra định kỳ sau khi nhiệm vụ đã kết thúc, hạn chế kiểm tra trong quá trình thực hiện.", "C. Tập trung kiểm soát cán bộ cấp dưới, không đặt ra yêu cầu kiểm soát đối với cơ quan tham mưu và người đứng đầu."], ans: "A" },
        { topic: "NQ 29", q: "Câu 10. Nghị quyết xác định vai trò của trí tuệ nhân tạo, công nghệ mới trong lãnh đạo, chỉ đạo như thế nào?", options: ["A. Có thể thay thế quyết định chính trị khi hệ thống dữ liệu đã đầy đủ và được liên thông.", "B. Hỗ trợ tham mưu, phân tích, dự báo, theo dõi tiến độ; không thay thế thẩm quyền, trách nhiệm quyết định của tổ chức, cá nhân.", "C. Chỉ sử dụng trong công tác thống kê, lưu trữ; không áp dụng cho kiểm tra, giám sát và cảnh báo sớm."], ans: "B" },

        // CHUYÊN ĐỀ 3: NQ 30
        { topic: "NQ 30", q: "Câu 1. Theo Nghị quyết, việc đổi mới nội dung đánh giá cán bộ phải bảo đảm nguyên tắc nào?", options: ["A. Phẩm chất chính trị, tư tưởng, đạo đức, liêm chính, kỷ luật.", "B. Năng lực thực tiễn, sản phẩm, kết quả, hiệu quả, mức độ cống hiến.", "C. Bảo đảm toàn diện, thực chất về phẩm chất chính trị, tư tưởng, đạo đức, liêm chính, kỷ luật; năng lực thực tiễn, sản phẩm, kết quả, hiệu quả, mức độ cống hiến, uy tín trong tổ chức và trước Nhân dân."], ans: "C" },
        { topic: "NQ 30", q: "Câu 2. Hai cán bộ cùng nhóm chức danh, cùng được giao một loại nhiệm vụ, nhưng một người công tác ở địa bàn thuận lợi, nguồn lực dồi dào; một người ở địa bàn khó khăn, nguồn lực hạn chế. Theo Nghị quyết, phương thức đánh giá phải:", options: ["A. Áp dụng thống nhất một bộ tiêu chí và một thang điểm chung để bảo đảm công bằng, khách quan.", "B. Đặt kết quả trong tương quan với thẩm quyền, nguồn lực, điều kiện, hoàn cảnh và độ khó của nhiệm vụ.", "C. Lấy mức độ hoàn thành chỉ tiêu đã đăng ký từ đầu năm làm căn cứ chủ yếu."], ans: "B" },
        { topic: "NQ 30", q: "Câu 3. Về hoàn thiện đồng bộ chức danh, nhiệm vụ, vị trí việc làm, Nghị quyết yêu cầu phải bảo đảm đồng thời hai mặt nào?", options: ["A. Cơ cấu chức danh và tiêu chuẩn cán bộ. Không vì cơ cấu mà hạ thấp tiêu chuẩn; không đặt ra tiêu chuẩn hình thức làm thu hẹp nguồn cán bộ.", "B. Không hạ thấp tiêu chuẩn về bằng cấp, đồng thời nâng cao tiêu chuẩn về kinh nghiệm thực tiễn.", "C. Bảo đảm tiêu chuẩn chung của Đảng, đồng thời cho phép mỗi cấp ủy quy định thêm tiêu chuẩn riêng phù hợp đặc thù."], ans: "A" },
        { topic: "NQ 30", q: "Câu 4. Nghị quyết xác định quan hệ giữa tiêu chuẩn chức danh với năng lực thực tiễn, kết quả thực hiện nhiệm vụ trong việc đánh giá mức độ phù hợp của cán bộ với vị trí như thế nào?", options: ["A. Tiêu chuẩn chức danh và năng lực thực tiễn là hai căn cứ ngang nhau, bổ sung cho nhau.", "B. Tiêu chuẩn là điều kiện cần; năng lực thực tiễn, kết quả thực hiện nhiệm vụ, khả năng đáp ứng yêu cầu vị trí là căn cứ quan trọng để đánh giá mức độ phù hợp.", "C. Năng lực thực tiễn là điều kiện cần; tiêu chuẩn chức danh là căn cứ quyết định khi lựa chọn nhân sự."], ans: "B" },
        { topic: "NQ 30", q: "Câu 5. Nghị quyết xác định chỉ tiêu đến năm 2030, việc xây dựng đội ngũ cán bộ cần đạt là gì?", options: ["A. Tỷ lệ cán bộ hoàn thành xuất sắc nhiệm vụ và tỷ lệ cán bộ đạt chuẩn chức danh.", "B. Mức độ hoàn thành các chỉ tiêu về cơ cấu cán bộ trẻ, cán bộ nữ, cán bộ là người dân tộc thiểu số.", "C. Bảo đảm cơ cấu cán bộ hợp lý; tiếp tục nâng tỷ lệ cán bộ trẻ, cán bộ nữ, cán bộ nữ, cán bộ là người dân tộc thiểu số, chuyên gia, nhà khoa học, nhân tài phù hợp với mô hình tổ chức chính quyền địa phương 2 cấp."], ans: "C" },
        { topic: "NQ 30", q: "Câu 6. Điểm mới của Nghị quyết về phương thức huy động, sử dụng nhân tài là gì?", options: ["A. Xuất phát từ yêu cầu nhiệm vụ, những vấn đề lớn, khó, chiến lược của đất nước; gắn việc sử dụng người tài với nhiệm vụ xứng tầm, thẩm quyền, nguồn lực, sản phẩm và giá trị cống hiến.", "B. Cho phép tuyển dụng không qua thi tuyển đối với người có học vị tiến sĩ và chuyên gia đầu ngành.", "C. Mở rộng chỉ tiêu biên chế cho các lĩnh vực khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số."], ans: "A" },
        { topic: "NQ 30", q: "Câu 7. Việc bố trí cán bộ phải bảo đảm yêu cầu gì?", options: ["A. Căn cứ yêu cầu thực tế để xác định.", "B. Bảo đảm cơ cấu hợp lý, năng lực và sở trường, đúng người, đúng việc.", "C. Thực hiện theo quy trình và báo cáo cấp có thẩm quyền."], ans: "B" },
        { topic: "NQ 30", q: "Câu 8. Nghị quyết yêu cầu phân định rõ hai loại chính sách nào đối với cán bộ?", options: ["A. Chính sách tiền lương theo ngạch, bậc với chính sách tiền thưởng theo kết quả công việc.", "B. Chính sách đối với cán bộ lãnh đạo, quản lý với chính sách đối với chuyên gia, cán bộ chuyên môn sâu.", "C. Chính sách đãi ngộ theo kết quả, cống hiến với chính sách hỗ trợ do điều kiện công tác khó khăn, nguy hiểm, rủi ro."], ans: "C" },
        { topic: "NQ 30", q: "Câu 9. Theo Nghị quyết, thước đo chất lượng tham mưu của cơ quan làm công tác tổ chức, cán bộ là gì?", options: ["A. Chất lượng đội ngũ và chất lượng quyết định cán bộ.", "B. Số lượng và tiến độ các đề án, văn bản được tham mưu ban hành đúng hạn.", "C. Mức độ chặt chẽ, chính xác của hồ sơ và quy trình nhân sự do cơ quan thẩm định."], ans: "A" },
        { topic: "NQ 30", q: "Câu 10. Sau khi đã phân cấp, phân quyền trong công tác cán bộ, trách nhiệm của cấp trên được Nghị quyết xác định là gì?", options: ["A. Thẩm định lại hồ sơ nhân sự trước khi cấp dưới ban hành quyết định.", "B. Không làm thay việc đã phân cấp; tập trung kiểm tra, giám sát, hậu kiểm và cảnh báo rủi ro.", "C. Cho ý kiến bằng văn bản đối với những trường hợp nhân sự quan trọng thuộc thẩm quyền cấp dưới."], ans: "B" },
        { topic: "NQ 30", q: "Câu 11. Đột phá về tạo nguồn của Nghị quyết chuyển công tác quy hoạch cán bộ theo hướng nào?", options: ["A. Từ quy hoạch khép kín theo chức danh sang chủ động chuẩn bị đội ngũ cho các nhiệm vụ và năng lực chiến lược của tương lai.", "B. Từ quy hoạch theo nhiệm kỳ sang quy hoạch dài hạn 10 năm cho từng chức danh lãnh đạo, quản lý.", "C. Từ quy hoạch do tập thể cấp ủy quyết định sang quy hoạch do người đứng đầu giới thiệu và chịu trách nhiệm."], ans: "A" },
        { topic: "NQ 30", q: "Câu 12. Chỉ tiêu đến năm 2030 về nguồn kế cận đối với vị trí lãnh đạo, quản lý cấp chiến lược và người đứng đầu các cấp là gì?", options: ["A. 100% vị trí có nguồn quy hoạch với hệ số từ 1,5 đến 2 lần số lượng cấp ủy viên đương nhiệm.", "B. Ít nhất 80% vị trí có nguồn kế cận tại chỗ, 20% còn lại chuẩn bị nguồn từ nơi khác điều động đến.", "C. 100% vị trí có nguồn kế cận được chuẩn bị nhiều lớp, có ít nhất 2 phương án gắn với kế hoạch phát hiện, đào tạo, bồi dưỡng, rèn luyện, thử thách và kiểm chứng qua thực tiễn."], ans: "C" },

        // CHUYÊN ĐỀ 4: QĐ 224
        { topic: "QĐ 224", q: "Câu 1. Nhận định nào dưới đây phản ánh đúng phạm vi điều chỉnh của Quy định số 224-QĐ/TW về đảng viên tham gia hoạt động đầu tư kinh doanh?", options: ["A. Chỉ quy định quyền sở hữu tài sản của đảng viên ngoài khu vực công.", "B. Chỉ quy định thủ tục kê khai và xin chấp thuận trước khi đảng viên đầu tư kinh doanh.", "C. Quy định về chủ trương, nguyên tắc, giới hạn, quyền, trách nhiệm và kiểm soát xung đột lợi ích đối với đảng viên tham gia hoạt động đầu tư kinh doanh."], ans: "C" },
        { topic: "QĐ 224", q: "Câu 2. Quy định số 224-QĐ/TW điều chỉnh việc tham gia hoạt động đầu tư kinh doanh đối với nhóm đảng viên nào?", options: ["A. Đảng viên trong và ngoài khu vực công, với quyền và giới hạn tương ứng theo chức danh, vị trí, nhiệm vụ.", "B. Chỉ đảng viên là viên chức.", "C. Chỉ đảng viên ngoài khu vực công."], ans: "A" },
        { topic: "QĐ 224", q: "Câu 3. Theo Quy định số 224-QĐ/TW, hoạt động đầu tư kinh doanh của đảng viên được phân thành những nhóm nào?", options: ["A. Hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành.", "B. Đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; đầu tư kinh doanh có tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối.", "C. Cả A và B."], ans: "C" },
        { topic: "QĐ 224", q: "Câu 4. Theo Quy định số 224-QĐ/TW, nhận định nào phản ánh đầy đủ nguyên tắc áp dụng quyền, giới hạn và kiểm soát xung đột lợi ích?", options: ["A. Áp dụng theo chức danh, vị trí công tác, chức trách, nhiệm vụ được giao; đảng viên giữ nhiều chức danh, thực hiện nhiều nhiệm vụ hoặc thuộc nhiều nhóm đối tượng phải tuân thủ giới hạn tương ứng với từng chức danh, nhiệm vụ, nhóm đối tượng.", "B. Chỉ áp dụng theo chức danh cao nhất mà đảng viên đang giữ.", "C. Chỉ áp dụng theo nơi đảng viên sinh hoạt đảng, không xét nhiệm vụ thực tế."], ans: "A" },
        { topic: "QĐ 224", q: "Câu 5. Theo Quy định số 224-QĐ/TW, nhận định nào đúng đối với đảng viên ngoài khu vực công khi được giao thực hiện nhiệm vụ công?", options: ["A. Phải xin chấp thuận của tổ chức đảng trước mọi khoản đầu tư kinh doanh hợp pháp.", "B. Không được lợi dụng tư cách đảng viên, chức vụ trong Đảng hoặc quan hệ với người có thẩm quyền để tạo lợi thế bất bình đẳng, tác động trái quy định, phục vụ lợi ích riêng, lợi ích nhóm; không được xử lý công việc, nhiệm vụ có xung đột lợi ích chưa được kiểm soát hoặc làm ảnh hưởng tiêu cực đến việc thực hiện nhiệm vụ công được giao.", "C. Được tự mình tiếp tục xử lý công việc có xung đột lợi ích chưa được kiểm soát."], ans: "B" },
        { topic: "QĐ 224", q: "Câu 6. Theo Quy định số 224-QĐ/TW, đảng viên là cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý được thực hiện những hoạt động nào mà không phải xin chấp thuận?", options: ["A. Hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành.", "B. Đầu tư thành lập tổ chức kinh tế hoặc chi phối tổ chức kinh tế.", "C. Đầu tư kinh doanh vào tổ chức kinh tế, lĩnh vực mà mình trực tiếp quyết định, quản lý."], ans: "A" },
        { topic: "QĐ 224", q: "Câu 7. Theo Quy định số 224-QĐ/TW, đảng viên là cán bộ, công chức không thuộc diện Bộ Chính trị, Ban Bí thư quản lý không được thực hiện hoạt động nào?", options: ["A. Hoạt động chuyên môn và khai thác tài sản tạo thu nhập.", "B. Đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành.", "C. Đầu tư kinh doanh có tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập chức kinh tế hoặc có chi phối."], ans: "C" },
        { topic: "QĐ 224", q: "Câu 8. Theo Quy định số 224-QĐ/TW, hoạt động nào đảng viên là viên chức được thực hiện mà không phải xin chấp thuận?", options: ["A. Hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; nếu không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích, được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành.", "B. Tạm thời rời vị trí công tác để thành lập, chi phối, quản lý, điều hành tổ chức kinh tế mà không cần quyết định của cấp có thẩm quyền.", "C. Viên chức không giữ chức vụ quản lý được trực tiếp điều hành tổ chức kinh tế trong khi vẫn làm việc mà không phải xin chấp thuận."], ans: "A" },
        { topic: "QĐ 224", q: "Câu 9. Theo Quy định số 224-QĐ/TW, đảng viên là cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý không được thực hiện hoạt động nào?", options: ["A. Hoạt động chuyên môn và khai thác tài sản tạo thu nhập.", "B. Đầu tư kinh doanh không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành.", "C. Đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối; duy trì khoản đầu tư kinh doanh có xung đột lợi ích chưa được kiểm soát."], ans: "C" },
        { topic: "QĐ 224", q: "Câu 10. Theo Quy định số 224-QĐ/TW, đảng viên là cán bộ, công chức không thuộc diện Bộ Chính trị, Ban Bí thư quản lý ở vị trí, lĩnh vực nào thì không được tham gia đầu tư kinh doanh?", options: ["A. Ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích.", "B. Không được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập.", "C. Không được thực hiện bất kỳ khoản đầu tư nào mà không tham gia quản lý, điều hành hoặc chi phối."], ans: "A" },
        { topic: "QĐ 224", q: "Câu 11. Theo Quy định số 224-QĐ/TW, đảng viên là viên chức giữ chức vụ quản lý không được thực hiện hoạt động nào?", options: ["A. Hoạt động chuyên môn và khai thác tài sản tạo thu nhập.", "B. Đồng thời quản lý, điều hành tổ chức kinh tế, trừ trường hợp được cử tham gia quản lý hoặc làm đại diện phần vốn, tài sản của đơn vị tại tổ chức kinh tế theo quy định của pháp luật.", "C. Đầu tư kinh doanh nhưng không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành."], ans: "B" },
        { topic: "QĐ 224", q: "Câu 12. Theo Quy định số 224-QĐ/TW, đảng viên đang công tác, phục vụ trong Quân đội Nhân dân, Công an Nhân dân tham gia đầu tư kinh doanh như thế nào?", options: ["A. Mọi đảng viên đều được trực tiếp quản lý, điều hành tổ chức kinh tế sau khi kê khai.", "B. Mọi hình thức đầu tư kinh doanh và hoạt động chuyên môn tạo thu nhập đều bị cấm.", "C. Được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; sau khi được chấp thuận nếu không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích thì được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối; phải bảo đảm bí mật nhà nước, bí mật công tác và yêu cầu quốc phòng, an ninh."], ans: "C" },
        { topic: "QĐ 224", q: "Câu 13. Theo Quy định số 224-QĐ/TW, đảng viên là người quản lý doanh nghiệp nhà nước, người đại diện phần vốn nhà nước được làm gì mà không phải xin chấp thuận?", options: ["A. Được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; mua, nhận, nắm giữ cổ phần, phần vốn góp và thực hiện quyền cổ đông, thành viên tại doanh nghiệp do mình quản lý hoặc đại diện phần vốn nhà nước theo quy định của pháp luật; việc thực hiện quyền đối với phần vốn cá nhân phải tách bạch với chức trách quản lý, đại diện phần vốn nhà nước và bảo đảm kiểm soát xung đột lợi ích.", "B. Được tự mình thành lập và trực tiếp điều hành tổ chức kinh tế ngoài khu vực công trong mọi lĩnh vực.", "C. Được đầu tư kinh doanh trong ngành, lĩnh vực có lợi ích liên quan trực tiếp đến doanh nghiệp nhà nước do mình quản lý, không cần điều kiện nào."], ans: "A" },
        { topic: "QĐ 224", q: "Câu 14. Theo Quy định số 224-QĐ/TW, đảng viên không còn công tác trong khu vực công sau khi thôi công tác, nghỉ hưu không được thực hiện hoạt động nào?", options: ["A. Các hoạt động bị hạn chế có liên quan đến lĩnh vực, công việc đã phụ trách trong phạm vi và thời hạn theo quy định của pháp luật.", "B. Hoạt động chuyên môn và khai thác tài sản tạo thu nhập hợp pháp.", "C. Đầu tư thành lập tổ chức kinh tế trong lĩnh vực không bị hạn chế theo pháp luật."], ans: "A" },
        { topic: "QĐ 224", q: "Câu 15. Theo Quy định số 224-QĐ/TW, đảng viên phải báo cáo về xung đột lợi ích khi nào?", options: ["A. Mỗi khi phát sinh bất kỳ khoản đầu tư hợp pháp nào, dù không có xung đột lợi ích.", "B. Chỉ khi đã có kết luận về hành vi vi phạm.", "C. Khi phát sinh xung đột lợi ích hoặc khi cấp có thẩm quyền phát hiện và yêu cầu thì phải kịp thời báo cáo cấp có thẩm quyền."], ans: "C" },

        // CHUYÊN ĐỀ 5: KL 105
        { topic: "KL 105", q: "Câu 1. Theo Kết luận, nhân tài được nhận thức như thế nào?", options: ["A. Là người có phẩm chất, tố chất, năng lực nổi trội và tư duy sáng tạo; có sản phẩm, thành tích hoặc đóng góp đặc biệt, có tính đột phá, tạo ra giá trị và tác động tích cực; có khả năng đảm niệm, giải quyết hiệu quả nhiệm vụ quan trọng, mới, khó, phức tạp.", "B. Là người có bằng cấp cao, học hàm, học vị và nhiều năm giữ chức vụ lãnh đạo, quản lý trong cơ quan nhà nước.", "C. Là người được cơ quan có thẩm quyền tuyển dụng vào biên chế và xếp ở ngạch chuyên môn cao nhất."], ans: "A" },
        { topic: "KL 105", q: "Câu 2. Việc thu hút và trọng dụng nhân tài phải đặt trong tổng thể nào và lấy nội dung nào làm định hướng cao nhất?", options: ["A. Đặt trong tổng thể phát triển đất nước và nhu cầu tăng số lượng người có học hàm, học vị trong khu vực công.", "B. Đặt trong tổng thể chiến lược phát triển đất nước, lấy lợi ích quốc gia, dân tộc làm định hướng cao nhất.", "C. Đặt trong tổng thể phát triển đất nước và mở rộng đồng đều chính sách nhân tài cho tất cả ngành, lĩnh vực và địa phương."], ans: "B" },
        { topic: "KL 105", q: "Câu 3. Theo quan điểm của Kết luận, đầu là khâu then chốt và đầu là nhiệm vụ căn bản, lâu dài trong công tác nhân tài?", options: ["A. Đãi ngộ là khâu then chốt; thu hút từ nước ngoài là nhiệm vụ căn bản, lâu dài.", "B. Tuyển dụng là khâu then chốt; đánh giá hằng năm là nhiệm vụ căn bản, lâu dài.", "C. Trọng dụng là khâu then chốt; tạo nguồn nhân tài là nhiệm vụ căn bản, lâu dài."], ans: "C" },
        { topic: "KL 105", q: "Câu 4. Đến năm 2030, Kết luận đặt mục tiêu phấn đấu thu hút, trọng dụng khoảng bao nhiêu nhân tài quốc gia gắn với từng nhiệm vụ, chương trình, dự án cụ thể?", options: ["A. Khoảng 1.000 nhân tài quốc gia.", "B. Khoảng 2.000 nhân tài quốc gia.", "C. Khoảng 5.000 nhân tài quốc gia."], ans: "A" },

        { topic: "KL 105", q: "Câu 6. Đến năm 2045, Việt Nam phấn đấu đạt vị trí nào về Chỉ số năng lực cạnh tranh nhân tài toàn cầu?", options: ["A. Thuộc nhóm 03 nước đứng đầu Đông Nam Á.", "B. Thuộc nhóm 10 quốc gia đứng đầu châu Á.", "C. Thuộc nhóm 20 quốc gia dẫn đầu thế giới."], ans: "C" },
        { topic: "KL 105", q: "Câu 7. Nhóm hạ tầng và công cụ số quốc gia về nhân tài được Kết luận xác định gồm những thành phần chủ yếu nào?", options: ["A. Cơ sở dữ liệu quốc gia về nhân tài, hệ thống chỉ số quốc gia về nhân tài, Cổng thông tin quốc gia về nhân tài và các nền tảng số phục vụ quản trị, đánh giá.", "B. Chỉ gồm Cơ sở dữ liệu quốc gia về nhân tài do Trung ương quản lý.", "C. Các cơ sở dữ liệu riêng biệt của từng địa phương, không kết nối và không dùng chung chỉ số đánh giá."], ans: "A" },
        { topic: "KL 105", q: "Câu 8. Mức ngân sách nhà nước dành cho công tác nhân tài được Kết luận định hướng như thế nào?", options: ["A. Khoảng 0,05% GDP hằng năm, bố trí ngoài nguồn lực dành cho khoa học, công nghệ.", "B. Khoảng 0,1% GDP hằng năm trong tổng nguồn lực dành cho khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số.", "C. Khoảng 1% GDP hằng năm, phân bổ bình quân cho các bộ, ngành, địa phương."], ans: "B" },
        { topic: "KL 105", q: "Câu 9. Nhân tài phải được đánh giá chủ yếu dựa trên căn cứ nào?", options: ["A. Bằng cấp, học hàm, học vị, chức vụ quản lý và thâm niên công tác.", "B. Vị trí công tác, độ tuổi, cơ quan công tác và số năm giữ chức vụ.", "C. Kết quả thực hiện nhiệm vụ, chất lượng sản phẩm và giá trị tạo ra."], ans: "C" },

        { topic: "KL 105", q: "Câu 11. Kết luận xác định việc phát hiện, giới thiệu, tiến cử nhân tài và sử dụng nhân tài trong khu vực công như thế nào?", options: ["A. Chỉ phát hiện trong khu vực công và phải tính đủ vào chi tiêu biên chế.", "B. Thực hiện từ nhiều nguồn trong và ngoài nước, không phân biệt khu vực công và khu vực tư, không tính vào chi tiêu biên chế đối với khu vực công.", "C. Chỉ tiếp nhận nhân tài là người Việt Nam ở nước ngoài theo chế độ tuyển dụng đặc biệt."], ans: "B" },
        { topic: "KL 105", q: "Câu 12. Phương thức nào được Kết luận chỉ rõ trong lựa chọn, sử dụng, trọng dụng nhân tài?", options: ["A. Thông qua tuyển dụng chính thức vào cơ quan nhà nước.", "B. Thông qua hợp đồng lao động không xác định thời hạn và bổ nhiệm chức vụ.", "C. Đặt hàng các nhiệm vụ chiến lược, bài toán lớn, chương trình, dự án trọng điểm."], ans: "C" },
        { topic: "KL 105", q: "Câu 13. Trong đánh giá kết quả thực hiện nhiệm vụ của nhân tài, Kết luận yêu cầu phân định rõ nội dung nào?", options: ["A. Rủi ro, thất bại khách quan trong nghiên cứu, đổi mới sáng tạo với hành vi thiếu trách nhiệm, gian lận hoặc vụ lợi.", "B. Kết quả của cá nhân với kết quả của tập thể để chỉ xem xét trách nhiệm của người đứng đầu.", "C. Nhiệm vụ có nguồn ngân sách nhà nước với nhiệm vụ do doanh nghiệp tài trợ để áp dụng hai tiêu chuẩn đánh giá khác nhau."], ans: "A" },
        { topic: "KL 105", q: "Câu 14. Cơ chế “Nhân tài dẫn dắt nhân tài” được hiểu đúng là gì?", options: ["A. Giao toàn bộ việc tuyển chọn nhân tài cho các chuyên gia quốc tế.", "B. Thực hiện cố vấn, hướng dẫn, truyền nghề giữa chuyên gia đầu ngành với nhân tài trẻ; xây dựng nhóm chuyên môn, tuyển chọn cộng sự và phát triển đội ngũ kế cận.", "C. Chỉ tổ chức các cuộc thi định kỳ để xếp hạng nhân tài theo từng ngành, lĩnh vực."], ans: "B" },

        { topic: "KL 106", q: "Câu 7. Trong dự toán ngân sách nhà nước năm 2027, Trung ương yêu cầu tiết kiệm ngay khi phân bổ ngân sách từ đầu năm như thế nào?", options: ["A. Tiết kiệm 5% chi đầu tư công để bổ sung cho các dự án trọng điểm, cấp thiết và 10% chi thường xuyên (ngoài tiết kiệm tạo nguồn cải cách tiền lương, các khoản chi lương, có tính chất tiền lương và các khoản chi cho con người) để bổ sung nguồn chi an sinh xã hội.", "B. Tiết kiệm 10% chi đầu tư công để bổ sung dự phòng ngân sách và 5% chi thường xuyên để bổ sung nguồn cải cách tiền lương.", "C. Tiết kiệm 5% chi thường xuyên để bổ sung cho các dự án trọng điểm, cấp thiết, không tiết kiệm chi đầu tư công."], ans: "A" },

    function getFiltered() {
        const kw = searchQuery.trim().toLowerCase();
        const out = [];
        quizData.forEach((item, id) => {
            const okTopic = mode === 'answers' || currentTopic === 'All' || item.topic === currentTopic;
            const okSearch = !kw || item.q.toLowerCase().includes(kw) ||
                item.options.some(o => o.toLowerCase().includes(kw));
            if (okTopic && okSearch) out.push({ item, id });
        });
        return out;
    }

    // Tô màu đáp án cho 1 câu
    function paintOptions(optionEls, item, id) {
        const chosen = picked[id];
        optionEls.forEach(el => {
            const letter = el.dataset.letter;
            el.classList.remove('correct', 'incorrect', 'locked');
            if (mode === 'answers') {
                if (letter === item.ans) el.classList.add('correct');
            } else if (chosen) {
                el.classList.add('locked');
                if (letter === item.ans) el.classList.add('correct');
                else if (letter === chosen) el.classList.add('incorrect');
            }
        });
    }

    function paintCard(details, item, id) {
        details.classList.remove('right', 'wrong');
        if (mode === 'quiz' && picked[id]) {
            details.classList.add(picked[id] === item.ans ? 'right' : 'wrong');
        }
    }

    function updateBar(list) {
        if (mode === 'quiz') {
            let done = 0, right = 0;
            list.forEach(({ item, id }) => {
                if (picked[id]) { done++; if (picked[id] === item.ans) right++; }
            });
            bar.innerHTML =
                `<span>Đã làm <b>${done}/${list.length}</b></span>` +
                `<span class="ok">Đúng <b>${right}</b></span>` +
                `<span class="bad">Sai <b>${done - right}</b></span>` +
                `<button class="btn" id="resetBtn">Làm lại</button>`;
            document.getElementById('resetBtn').addEventListener('click', () => {
                list.forEach(({ id }) => delete picked[id]);
                render();
            });
        } else {
            bar.innerHTML = `<span><b>${list.length}</b> câu hỏi</span>`;
        }
    }

    function render() {
        const list = getFiltered();
        document.getElementById('filters').classList.toggle('hidden', mode === 'answers');
        listContainer.className = mode;
        listContainer.innerHTML = '';
        updateBar(list);

        if (list.length === 0) {
            listContainer.innerHTML = '<p class="empty">Không tìm thấy câu hỏi nào phù hợp.</p>';
            return;
        }

        list.forEach(({ item, id }) => {
            const details = document.createElement('details');
            if (openState[mode].has(id)) details.open = true;
            details.addEventListener('toggle', () => {
                if (details.open) {
                    if (mode === 'answers') {
                        // Mỗi lần chỉ mở 1 câu: đóng các câu khác
                        openState.answers.clear();
                        listContainer.querySelectorAll('details[open]').forEach(d => {
                            if (d !== details) d.open = false;
                        });
                    }
                    openState[mode].add(id);
                } else {
                    openState[mode].delete(id);
                }
            });

            const summary = document.createElement('summary');
            const tag = document.createElement('span');
            tag.className = 'topic-tag';
            tag.textContent = item.topic;
            const text = document.createElement('span');
            text.textContent = item.q;
            if (mode === 'quiz') summary.append(tag, text);
            else {
                summary.classList.add('no-tag');
                summary.append(text);
            }

            const box = document.createElement('div');
            box.className = 'options';

            const optionEls = item.options.map(opt => {
                const el = document.createElement('div');
                el.className = 'option';
                el.dataset.letter = letterOf(opt);
                el.textContent = opt;

                if (mode === 'quiz') {
                    el.tabIndex = 0;
                    el.setAttribute('role', 'button');
                    const choose = () => {
                        if (picked[id]) return;               // đã trả lời thì khóa
                        picked[id] = el.dataset.letter;
                        paintOptions(optionEls, item, id);
                        paintCard(details, item, id);
                        updateBar(getFiltered());
                    };
                    el.addEventListener('click', choose);
                    el.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); }
                    });
                }
                box.appendChild(el);
                return el;
            });

            paintOptions(optionEls, item, id);
            paintCard(details, item, id);

            details.append(summary, box);
            listContainer.appendChild(details);
        });
    }

    // Chuyển cửa sổ
    tabs.forEach(tab => tab.addEventListener('click', () => {
        mode = tab.dataset.mode;
        tabs.forEach(t => {
            const on = t === tab;
            t.classList.toggle('active', on);
            t.setAttribute('aria-selected', on);
        });
        render();
    }));

    // Tìm kiếm
    const searchClear = document.getElementById('searchClear');

    searchInput.addEventListener('input', e => {
        searchQuery = e.target.value;
        searchClear.classList.toggle('hidden', !searchQuery);
        render();
    });

    // Nút xoá nội dung tìm kiếm
    searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        searchClear.classList.add('hidden');
        searchInput.focus();
        render();
    });

    // Lọc theo chuyên đề
    filterBtns.forEach(btn => btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTopic = btn.dataset.topic;
        render();
    }));

    render();
</script>
</body>
</html>
